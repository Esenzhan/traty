<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Safari's banner over the page: Traty's icon, name and «Открыть / Загрузить» (Smart App Banner). -->
<meta name="apple-itunes-app" content="app-id=6825177056">
<title>Traty – Apple Pay</title>
<style>
  :root { --bg: #f2f2f7; --card: #ffffff; --ink: #1c1c1e; --soft: #8e8e93; --accent: #30b184; --violet: #5b3fb5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --card: #1c1c1e; --ink: #f2f2f7; --soft: #9d9da4; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .brand img { width: 52px; height: 52px; border-radius: 12px; }
  .brand b { display: block; font-size: 20px; }
  .brand span { color: var(--soft); font-size: 15px; }
  h1 { font-size: 34px; line-height: 1.1; letter-spacing: -0.6px; margin: 0 0 12px; }
  .lead { color: var(--soft); margin: 0 0 28px; }
  .soon { background: var(--violet); color: #fff; border-radius: 24px; padding: 28px 22px; text-align: center; }
  .soon svg { width: 44px; height: 44px; margin-bottom: 10px; }
  .soon b { display: block; font-size: 24px; margin-bottom: 6px; }
  .soon p { margin: 0; opacity: 0.85; font-size: 15px; }
  .note { color: var(--soft); font-size: 15px; text-align: center; margin-top: 20px; }
  .langs { display: flex; justify-content: center; gap: 8px; margin-top: 28px; }
  .langs a { color: var(--soft); text-decoration: none; font-size: 15px; padding: 6px 12px; border-radius: 999px; }
  .langs a.on { background: var(--card); color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="icon.png" alt="" onerror="this.remove()">
    <div><b>Traty</b><span data-t="brand"></span></div>
  </div>
  <h1 data-t="title"></h1>
  <p class="lead" data-t="lead"></p>
  <div class="soon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <b data-t="soon"></b>
    <p data-t="soonText"></p>
  </div>
  <p class="note" data-t="note"></p>
  <nav class="langs">
    <a href="?lang=kk" data-lang="kk">Қазақша</a>
    <a href="?lang=ru" data-lang="ru">Русский</a>
    <a href="?lang=en" data-lang="en">English</a>
  </nav>
</main>
<script>
  // The app opens this page with ?lang=kk|ru|en; without it – the browser's language.
  var TEXTS = {
    ru: {
      brand: "Учёт расходов",
      title: "Автоматизация Apple Pay",
      lead: "После оплаты через Apple Pay трата сама попадает в «Новые оплаты» Traty: сумма и магазин уже подставлены.",
      soon: "Скоро здесь",
      soonText: "Пошаговая инструкция со скриншотами и видео.",
      note: "А пока – шаги в Traty: «Настройки» → «Быстрые кнопки»."
    },
    kk: {
      brand: "Шығындарды есепке алу",
      title: "Apple Pay автоматтандыру",
      lead: "Apple Pay арқылы төлегеннен кейін шығын Traty-дағы «Жаңа төлемдер» бөліміне өзі түседі: сомасы мен дүкені дайын тұрады.",
      soon: "Жақында осында",
      soonText: "Скриншоттары мен бейнесі бар толық нұсқаулық.",
      note: "Әзірге қадамдар Traty-да: «Баптаулар» → «Жылдам пәрмендер»."
    },
    en: {
      brand: "Expense tracker",
      title: "Apple Pay automation",
      lead: "After you pay with Apple Pay, the expense lands in Traty's «New payments» with the amount and shop already filled in.",
      soon: "Coming soon",
      soonText: "A step-by-step guide with screenshots and video.",
      note: "Meanwhile, the steps are in Traty: Settings → Shortcuts."
    }
  };
  var asked = new URLSearchParams(location.search).get("lang");
  var phone = (navigator.language || "en").slice(0, 2);
  var lang = TEXTS[asked] ? asked : TEXTS[phone] ? phone : "en";
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = TEXTS[lang][el.getAttribute("data-t")]; });
  document.querySelectorAll("[data-lang]").forEach(function (el) { if (el.getAttribute("data-lang") === lang) el.className = "on"; });
</script>
</body>
</html>
