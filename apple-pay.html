<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Safari's banner over the page: Traty's icon, name and «Открыть / Загрузить» (Smart App Banner). -->
<meta name="apple-itunes-app" content="app-id=6825177056">
<title>Traty – Apple Pay</title>
<style>
  :root { --bg: #f2f2f7; --card: #ffffff; --ink: #1c1c1e; --soft: #8e8e93; --line: #e5e5ea; --pill: #1c1c1e; --pillInk: #ffffff; --violet: #5b3fb5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --card: #1c1c1e; --ink: #f2f2f7; --soft: #9d9da4; --line: #2c2c2e; --pill: #f2f2f7; --pillInk: #1c1c1e; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .brand img { width: 52px; height: 52px; border-radius: 12px; }
  .brand b { display: block; font-size: 20px; }
  .brand span { color: var(--soft); font-size: 15px; }
  h1 { font-size: 34px; line-height: 1.1; letter-spacing: -0.6px; margin: 0 0 12px; }
  h2 { font-size: 22px; margin: 32px 0 12px; }
  .lead { color: var(--soft); margin: 0 0 24px; }
  .switch { display: flex; background: var(--card); border-radius: 999px; padding: 4px; margin-bottom: 16px; }
  .switch button { flex: 1; border: 0; background: none; color: var(--ink); font: inherit; font-size: 15px; font-weight: 600; padding: 9px 0; border-radius: 999px; cursor: pointer; transition: background .25s, color .25s; }
  .switch button.on { background: var(--pill); color: var(--pillInk); }
  .video { position: relative; width: 100%; max-width: 360px; margin: 0 auto; aspect-ratio: 9 / 16; border-radius: 24px; overflow: hidden; background: var(--card); }
  .video video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .soon { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; background: var(--violet); color: #fff; }
  .soon svg { width: 44px; height: 44px; margin-bottom: 10px; }
  .soon b { font-size: 22px; margin-bottom: 6px; }
  .soon p { margin: 0; opacity: 0.85; font-size: 15px; }
  .hint { color: var(--soft); font-size: 15px; text-align: center; margin: 12px 0 0; }
  .stage { background: var(--card); border-radius: 16px; padding: 4px 16px; margin-bottom: 16px; }
  .stage h3 { font-size: 15px; color: var(--soft); font-weight: 600; margin: 12px 0 4px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  li i { flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--violet); color: #fff; font-style: normal; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; }
  .note { color: var(--soft); font-size: 15px; text-align: center; margin-top: 8px; }
  .langs { margin-left: auto; align-self: flex-start; display: flex; background: var(--card); border-radius: 999px; padding: 3px; }
  .langs a { color: var(--soft); text-decoration: none; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 999px; }
  .langs a.on { background: var(--pill); color: var(--pillInk); }
  footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); text-align: center; color: var(--soft); font-size: 13px; }
  footer .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin-bottom: 8px; }
  footer a { color: var(--soft); }
  footer p { margin: 0; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="icon.png" alt="" onerror="this.remove()">
    <div><b>Traty</b><span data-t="brand"></span></div>
    <nav class="langs">
      <a href="?lang=kk" data-lang="kk">ҚАЗ</a>
      <a href="?lang=ru" data-lang="ru">РУС</a>
      <a href="?lang=en" data-lang="en">ENG</a>
    </nav>
  </div>
  <h1 data-t="title"></h1>
  <p class="lead" data-t="lead"></p>

  <div class="switch" role="tablist">
    <button type="button" data-ios="26">iOS 26</button>
    <button type="button" data-ios="27">iOS 27</button>
  </div>
  <div class="video" id="video"></div>
  <p class="hint" data-t="older"></p>

  <h2 data-t="steps"></h2>
  <div id="stages"></div>
  <p class="note" data-t="note"></p>

  <footer>
    <div class="links"><a href="privacy-policy.html" data-t="privacy"></a><a href="terms.html" data-t="terms"></a><a href="mailto:traty.help@gmail.com" data-t="help"></a></div>
    <p>© 2026 Traty · Yessenzhan Nurbayev</p>
  </footer>
</main>
<script>
  // The videos are our own files next to the page (videos/<lang>-<ios>.mp4, 1080p H.264,
  // with a first-frame poster), played by the phone's own player – YouTube drew its
  // Shorts bar, likes and channel over them (2026-11-10). A language without its own
  // video shows «the video is coming».
  var VIDEOS = { kk: ["26", "27"], ru: ["26", "27"], en: [] };

  // The app opens this page with ?lang=kk|ru|en; without it – the browser's language.
  // Steps are the app's own («Настройки» → «Быстрые кнопки»), word for word.
  var TEXTS = {
    ru: {
      brand: "Учёт расходов",
      title: "Автоматизация Apple Pay",
      lead: "После оплаты через Apple Pay трата сама попадает в «Новые оплаты» Traty: сумма и магазин уже подставлены. Настройка – один раз, около минуты.",
      soon: "Видео скоро",
      soonText: "А пока – шаги ниже.",
      older: "iOS 18 и старше – по шагам ниже.",
      steps: "Шаги",
      note: "Те же шаги есть в Traty: «Настройки» → «Быстрые кнопки».",
      privacy: "Конфиденциальность", terms: "Условия", help: "Поддержка",
      stages: [
        { title: "Создайте автоматизацию", steps: [
          "В «Командах» – вкладка «Автоматизация» → «+» и выберите «Транзакция» (в новых iOS – «Wallet»).",
          "Отметьте карты, выберите «Немедленный запуск» и нажмите «Далее».",
          "Нажмите серую карточку «Новая автоматизация» (в новых iOS – «Создать новую быструю команду»), найдите в поиске действий «Traty» и выберите «Расход из Wallet»."
        ] },
        { title: "Заполните действие", steps: [
          "Нажмите поле «Сумма» → «Выбрать переменную» → «Входные данные команды». Нажмите появившуюся метку и выберите «Сумма».",
          "Нажмите стрелку в действии, затем так же «Магазин» → «Входные данные команды» → «Продавец».",
          "Нажмите «Готово». Бюджет и категорию выбирать не нужно."
        ] }
      ]
    },
    kk: {
      brand: "Шығындарды есепке алу",
      title: "Apple Pay автоматтандыру",
      lead: "Apple Pay арқылы төлегеннен кейін шығын Traty-дағы «Жаңа төлемдер» бөліміне өзі түседі: сомасы мен дүкені дайын тұрады. Бір рет баптайсыз, шамамен бір минут.",
      soon: "Бейне жақында",
      soonText: "Әзірге – төмендегі қадамдар.",
      older: "iOS 18 және одан ескі – төмендегі қадамдармен.",
      steps: "Қадамдар",
      note: "Осы қадамдар Traty-да да бар: «Баптаулар» → «Жылдам пәрмендер».",
      privacy: "Құпиялылық", terms: "Шарттар", help: "Қолдау",
      stages: [
        { title: "Автоматтандыру жасаңыз", steps: [
          "«Пәрмендер» қолданбасында «Автоматтандыру» қойындысы → «+» → «Wallet» таңдаңыз.",
          "Карталарды белгілеп, «Дереу іске қосу» таңдаңыз да, «Келесі» батырмасын басыңыз.",
          "«Жаңа жылдам пәрменді жасау» батырмасын басыңыз, «Әрекеттерді іздеу» жолынан «Traty» тауып, «Wallet-тан шығын» таңдаңыз."
        ] },
        { title: "Әрекетті толтырыңыз", steps: [
          "«Сома» өрісін басыңыз → «Айнымалыны таңдау» → «Пәрмен кіріс деректері». Пайда болған белгіні басып, «Сома» таңдаңыз.",
          "Сосын дәл солай «Дүкен» өрісі → «Айнымалыны таңдау» → «Пәрмен кіріс деректері» → белгіні басып, «Сатушы» таңдаңыз.",
          "«Дайын» батырмасын басыңыз. Бюджет пен санатты таңдаудың қажеті жоқ."
        ] }
      ]
    },
    en: {
      brand: "Expense tracker",
      title: "Apple Pay automation",
      lead: "After you pay with Apple Pay, the expense lands in Traty's “New payments” with the amount and shop already filled in. Set it up once – about a minute.",
      soon: "Video coming soon",
      soonText: "Meanwhile – the steps below.",
      older: "iOS 18 and older – follow the steps below.",
      steps: "Steps",
      note: "The same steps are in Traty: Settings → Shortcuts.",
      privacy: "Privacy", terms: "Terms", help: "Support",
      stages: [
        { title: "Create the automation", steps: [
          "In Shortcuts – the Automation tab → “+” and choose “Transaction” (“Wallet” in newer iOS).",
          "Tick the cards, choose “Run Immediately” and tap “Next”.",
          "Tap the grey “New Blank Automation” card (“Create New Shortcut” in newer iOS), search the actions for “Traty” and choose “Expense from Wallet”."
        ] },
        { title: "Fill in the action", steps: [
          "Tap the “Amount” field → “Select Variable” → “Shortcut Input”. Tap the tag that appears and choose “Amount”.",
          "Tap the arrow in the action, then likewise “Shop” → “Shortcut Input” → “Merchant”.",
          "Tap “Done”. No need to choose a budget or a category."
        ] }
      ]
    }
  };

  var asked = new URLSearchParams(location.search).get("lang");
  var phone = (navigator.language || "en").slice(0, 2);
  var lang = TEXTS[asked] ? asked : TEXTS[phone] ? phone : "en";
  var T = TEXTS[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = T[el.getAttribute("data-t")]; });
  document.querySelectorAll("[data-lang]").forEach(function (el) { if (el.getAttribute("data-lang") === lang) el.className = "on"; });

  // What to tap, in quotes, set in bold – as in the app.
  function bolded(text) {
    var out = document.createDocumentFragment();
    text.split(/([«“][^»”]*[»”])/).forEach(function (part, i) {
      if (!part) return;
      var node = i % 2 ? document.createElement("b") : document.createTextNode(part);
      if (i % 2) node.textContent = part;
      out.appendChild(node);
    });
    return out;
  }
  var n = 0;
  T.stages.forEach(function (stage) {
    var box = document.createElement("div"); box.className = "stage";
    var h = document.createElement("h3"); h.textContent = stage.title; box.appendChild(h);
    var ol = document.createElement("ol");
    stage.steps.forEach(function (step) {
      var li = document.createElement("li");
      var num = document.createElement("i"); num.textContent = ++n; li.appendChild(num);
      var span = document.createElement("span"); span.appendChild(bolded(step)); li.appendChild(span);
      ol.appendChild(li);
    });
    box.appendChild(ol);
    document.getElementById("stages").appendChild(box);
  });

  // iOS switch: the phone's own version is picked first (27 and newer → 27, else 26).
  var m = navigator.userAgent.match(/OS (\d+)_/);
  var ios = m && +m[1] >= 27 ? "27" : "26";
  var saved = new URLSearchParams(location.search).get("ios");
  if (saved === "26" || saved === "27") ios = saved;
  var video = document.getElementById("video");
  function show(version) {
    ios = version;
    document.querySelectorAll("[data-ios]").forEach(function (b) { b.className = b.getAttribute("data-ios") === version ? "on" : ""; });
    video.innerHTML = "";
    if ((VIDEOS[lang] || []).indexOf(version) >= 0) {
      var player = document.createElement("video");
      var name = "videos/" + lang + "-" + version;
      player.src = name + ".mp4";
      player.poster = name + ".jpg";
      player.controls = true;
      player.playsInline = true;
      player.preload = "metadata";
      player.setAttribute("playsinline", "");
      player.title = T.title + " – iOS " + version;
      video.appendChild(player);
    } else {
      video.innerHTML = '<div class="soon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><b></b><p></p></div>';
      video.querySelector("b").textContent = T.soon;
      video.querySelector("p").textContent = T.soonText;
    }
  }
  document.querySelectorAll("[data-ios]").forEach(function (b) { b.onclick = function () { show(b.getAttribute("data-ios")); }; });
  show(ios);
</script>
</body>
</html>
