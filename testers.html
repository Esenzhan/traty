<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Traty – тестирование на Android</title>
<style>
  :root { --bg: #f2f2f7; --card: #ffffff; --ink: #1c1c1e; --soft: #8e8e93; --line: #e5e5ea; --pill: #1c1c1e; --pillInk: #ffffff; --green: #0a7a5a; --greenInk: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --card: #1c1c1e; --ink: #f2f2f7; --soft: #9d9da4; --line: #2c2c2e; --pill: #f2f2f7; --pillInk: #1c1c1e; --green: #1e8a64; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .brand img { width: 52px; height: 52px; border-radius: 12px; }
  .brand b { display: block; font-size: 20px; }
  .brand span { color: var(--soft); font-size: 15px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand > div { min-width: 0; }
  .langs { flex: none; margin-left: auto; align-self: flex-start; display: flex; background: var(--card); border-radius: 999px; padding: 3px; }
  .langs a { color: var(--soft); text-decoration: none; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 999px; }
  .langs a.on { background: var(--pill); color: var(--pillInk); }
  h1 { font-size: 32px; line-height: 1.12; letter-spacing: -0.6px; margin: 0 0 12px; }
  .lead { color: var(--soft); margin: 0 0 20px; }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; }
  .card p { margin: 0; }
  .card p + p { margin-top: 8px; }
  .step { background: var(--card); border-radius: 20px; padding: 18px 16px 20px; margin-bottom: 16px; }
  .head { display: flex; gap: 12px; align-items: flex-start; }
  .head i { flex: none; width: 30px; height: 30px; border-radius: 9px; background: var(--green); color: var(--greenInk); font-style: normal; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .head b { display: block; font-size: 19px; line-height: 1.3; }
  .head p { margin: 4px 0 0; color: var(--soft); font-size: 15px; }
  .go { display: block; max-width: 280px; margin: 16px auto 0; padding: 12px 16px; border-radius: 12px; background: var(--green); color: var(--greenInk); text-decoration: none; font-weight: 600; text-align: center; font-size: 16px; }
  .shot { display: block; width: 100%; max-width: 280px; margin: 16px auto 0; border-radius: 22px; border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,0.10); background: #fff; }
  .note { color: var(--soft); font-size: 15px; margin: 8px 0 0; }
  h2 { font-size: 22px; margin: 32px 0 12px; }
  ul { margin: 0; padding-left: 20px; }
  li + li { margin-top: 6px; }
  a { color: var(--green); }
  footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); text-align: center; color: var(--soft); font-size: 13px; }
  footer .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin-bottom: 8px; }
  footer a { color: var(--soft); }
  footer p { margin: 0; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="icon.png" alt="" onerror="this.remove()">
    <div><b>Traty</b><span data-t="brand"></span></div>
    <nav class="langs">
      <a href="?lang=kk" data-lang="kk">ҚАЗ</a>
      <a href="?lang=ru" data-lang="ru">РУС</a>
      <a href="?lang=en" data-lang="en">ENG</a>
    </nav>
  </div>
  <h1 data-t="title"></h1>
  <p class="lead" data-t="lead"></p>
  <div class="card"><p data-t="before"></p></div>
  <div id="steps"></div>

  <h2 data-t="afterTitle"></h2>
  <div class="card"><ul id="after"></ul></div>

  <footer>
    <div class="links"><a href="privacy-policy.html" data-t="privacy"></a><a href="terms.html" data-t="terms"></a><a href="mailto:traty.help@gmail.com" data-t="help"></a></div>
    <p>© 2026 Traty · Yessenzhan Nurbayev</p>
  </footer>
</main>
<script>
  // Closed test on Google Play (2026-11-13): the group, then the testing page, then
  // the store. Screenshots are cut from the desktop browser to a phone's size; the
  // tester's photo and name are hidden.
  var GROUP = "https://groups.google.com/g/traty-testers";
  var TESTING = "https://play.google.com/apps/testing/app.traty.mobile";
  var STORE = "https://play.google.com/store/apps/details?id=app.traty.mobile";
  var SHOTS = ["testers/1-group.png", "testers/2-join.png", "testers/3-tester.png", "testers/4-done.png", "testers/5-install.png"];
  var LINKS = [GROUP, null, TESTING, null, STORE];

  var TEXTS = {
    ru: {
      brand: "Учёт расходов",
      title: "Как стать тестировщиком Traty на Android",
      lead: "Traty пока в закрытом тесте Google Play. Пять шагов – около двух минут.",
      before: "Делайте всё под тем же Google-аккаунтом, что и на вашем Android-телефоне. Удобнее всего – прямо с телефона.",
      go: ["Открыть группу", "", "Открыть страницу теста", "", "Открыть Traty в Google Play"],
      steps: [
        { title: "Вступите в группу тестировщиков", text: "Откройте группу «Traty testers» и нажмите «Присоединиться»." },
        { title: "Подтвердите вступление", text: "Имя можно оставить любым, остальное не трогать. Нажмите «Присоединиться» внизу." },
        { title: "Станьте тестировщиком", text: "Откройте страницу теста и нажмите «Стать тестировщиком» (Become a tester)." },
        { title: "Готово – вы в тесте", text: "Появится «Вы тестировщик» (You are a tester). Нажмите ссылку «скачать в Google Play» (download it on Google Play)." },
        { title: "Установите Traty", text: "Нажмите «Установить» (Install). Если пишет, что приложение не найдено, – подождите до пары часов: Google не сразу открывает доступ." }
      ],
      afterTitle: "Что дальше",
      after: [
        "Не удаляйте Traty 14 дней и открывайте время от времени – так Google засчитывает тест.",
        "Нашли ошибку или есть идея – пишите на <a href=\"mailto:traty.help@gmail.com\">traty.help@gmail.com</a>.",
        "Обновления придут сами через Google Play.",
        "У вас iPhone? Traty уже в <a href=\"https://apps.apple.com/app/id6825177056\">App Store</a>."
      ],
      privacy: "Конфиденциальность", terms: "Условия", help: "Поддержка"
    },
    kk: {
      brand: "Шығындарды есепке алу",
      title: "Android-та Traty тестілеушісі қалай болуға болады",
      lead: "Traty әзірге Google Play-де жабық тестте. Бес қадам – шамамен екі минут.",
      before: "Барлығын Android-телефоныңыздағы Google аккаунтымен жасаңыз. Ең оңайы – тікелей телефоннан.",
      go: ["Топты ашу", "", "Тест бетін ашу", "", "Traty-ды Google Play-де ашу"],
      steps: [
        { title: "Тестілеушілер тобына қосылыңыз", text: "«Traty testers» тобын ашып, топқа қосылу батырмасын басыңыз (суретте – «Присоединиться»)." },
        { title: "Қосылуды растаңыз", text: "Атыңызды кез келген қалдыруға болады, қалғанын өзгертпеңіз. Төмендегі қосылу батырмасын басыңыз." },
        { title: "Тестілеуші болыңыз", text: "Тест бетін ашып, тестілеуші болу батырмасын басыңыз (Become a tester)." },
        { title: "Дайын – сіз тесттесіз", text: "«Сіз тестілеушісіз» (You are a tester) жазуы шығады. Google Play-ден жүктеу сілтемесін басыңыз (download it on Google Play)." },
        { title: "Traty-ды орнатыңыз", text: "Орнату батырмасын басыңыз (Install). Қолданба табылмады десе, бір-екі сағат күтіңіз: Google рұқсатты бірден ашпайды." }
      ],
      afterTitle: "Әрі қарай",
      after: [
        "Traty-ды 14 күн өшірмеңіз және анда-санда ашып тұрыңыз – Google тестті осылай есептейді.",
        "Қате тапсаңыз немесе идеяңыз болса – <a href=\"mailto:traty.help@gmail.com\">traty.help@gmail.com</a> поштасына жазыңыз.",
        "Жаңартулар Google Play арқылы өзі келеді.",
        "iPhone-ыңыз бар ма? Traty <a href=\"https://apps.apple.com/app/id6825177056\">App Store</a>-да бар."
      ],
      privacy: "Құпиялылық", terms: "Шарттар", help: "Қолдау"
    },
    en: {
      brand: "Expense tracker",
      title: "How to test Traty on Android",
      lead: "Traty is in a closed test on Google Play. Five steps – about two minutes.",
      before: "Use the same Google account as on your Android phone. It's easiest to do it right on the phone.",
      go: ["Open the group", "", "Open the test page", "", "Open Traty on Google Play"],
      steps: [
        { title: "Join the testers group", text: "Open the “Traty testers” group and tap Join group." },
        { title: "Confirm", text: "Any name is fine; leave the rest as is. Tap Join at the bottom." },
        { title: "Become a tester", text: "Open the test page and tap Become a tester." },
        { title: "Done – you're in", text: "You'll see “You are a tester”. Tap the “download it on Google Play” link." },
        { title: "Install Traty", text: "Tap Install. If it says the app isn't found, wait up to a couple of hours – Google takes a while to open access." }
      ],
      afterTitle: "What's next",
      after: [
        "Keep Traty installed for 14 days and open it now and then – that's how Google counts the test.",
        "Found a bug or have an idea? Write to <a href=\"mailto:traty.help@gmail.com\">traty.help@gmail.com</a>.",
        "Updates come by themselves through Google Play.",
        "On iPhone? Traty is already on the <a href=\"https://apps.apple.com/app/id6825177056\">App Store</a>."
      ],
      privacy: "Privacy", terms: "Terms", help: "Support"
    }
  };

  var asked = new URLSearchParams(location.search).get("lang");
  var phone = (navigator.language || "en").slice(0, 2);
  var lang = TEXTS[asked] ? asked : TEXTS[phone] ? phone : "en";
  var T = TEXTS[lang];
  document.documentElement.lang = lang;
  document.title = "Traty – " + T.title;
  document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = T[el.dataset.t]; });
  document.querySelectorAll("[data-lang]").forEach(function (a) { a.classList.toggle("on", a.dataset.lang === lang); });

  var list = document.getElementById("steps");
  T.steps.forEach(function (step, i) {
    var box = document.createElement("section");
    box.className = "step";
    var head = document.createElement("div");
    head.className = "head";
    head.innerHTML = "<i>" + (i + 1) + "</i><div><b></b><p></p></div>";
    head.querySelector("b").textContent = step.title;
    head.querySelector("p").textContent = step.text;
    box.appendChild(head);
    if (LINKS[i]) {
      var go = document.createElement("a");
      go.className = "go";
      go.href = LINKS[i];
      go.textContent = T.go[i];
      box.appendChild(go);
    }
    var img = document.createElement("img");
    img.className = "shot";
    img.src = SHOTS[i];
    img.alt = step.title;
    img.loading = "lazy";
    box.appendChild(img);
    list.appendChild(box);
  });
  document.getElementById("after").innerHTML = T.after.map(function (line) { return "<li>" + line + "</li>"; }).join("");
</script>
</body>
</html>
